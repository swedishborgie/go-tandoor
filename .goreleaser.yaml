version: 2
project_name: tandoor

builds:
  - id: tandoor
    main: ./cmd/tandoor
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - "-s -w"
      - "-X main.version={{.Tag}}"

archives:
  - formats: [tar]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: swedishborgie
    name: go-tandoor
